# Oryvex Research — production vhost (HTTPS).
# Use this AFTER certbot has issued the certificate:
#     sudo certbot certonly --nginx -d oryvexresearch.com -d www.oryvexresearch.com
#
# Install:
#     sudo cp /opt/oryvex/deploy/nginx-ssl.conf /etc/nginx/sites-available/oryvex
#     sudo nginx -t && sudo systemctl reload nginx
#
# This file REPLACES the plain-HTTP deploy/nginx.conf. It only ever names
# oryvexresearch.com, so neighbouring vhosts on this box are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name oryvexresearch.com www.oryvexresearch.com;

    # Let certbot answer renewal challenges over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04) does not know the 1.25+ `http2 on;` directive.
    # No protocol options here on purpose: other vhosts on this box already set
    # them for :443, and repeating them produces "protocol options redefined"
    # warnings. HTTP/2 is negotiated per listening socket, not per vhost.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oryvexresearch.com www.oryvexresearch.com;

    ssl_certificate     /etc/letsencrypt/live/oryvexresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oryvexresearch.com/privkey.pem;
    # Settings inlined rather than `include`-ing certbot's snippets: with
    # `certonly` those files are not guaranteed to exist, and a missing include
    # fails `nginx -t` outright.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20M;   # allow COA / image uploads in the admin panel

    # Static assets (incl. uploaded COAs) straight off disk.
    location /static/ {
        alias /opt/oryvex/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
