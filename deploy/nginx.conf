# Nginx reverse proxy for the Oryvex Research store.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/oryvex
#          sudo ln -s /etc/nginx/sites-available/oryvex /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL: after DNS points at this server, run:
#          sudo certbot certonly --webroot -w /var/www/html \
#                  -d oryvexresearch.com -d www.oryvexresearch.com
#      Then add your own 443 server block below. On a multi-site VPS do NOT use
#      `certbot --nginx` — it can rewrite a neighbouring site's vhost.

server {
    listen 80;
    server_name oryvexresearch.com www.oryvexresearch.com;

    client_max_body_size 20M;   # allow COA/image uploads

    # Serve static assets (incl. uploaded COAs) directly from disk.
    location /static/ {
        alias /opt/oryvex/static/;
        expires 7d;
        access_log off;
    }

    # COA files live under /static/coa/ — served by the block above.

    location / {
        proxy_pass         http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
